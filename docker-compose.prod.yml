name: portfolio

services:
  web:
    image: ghcr.io/vorynkavitaliy/portfolio:${TAG:?TAG is set by deploy.sh}
    env_file: .env
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: --max-old-space-size=384
    ports:
      - 127.0.0.1:3000:3000
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /app/.next/cache:size=64m,uid=1001,gid=1001
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    network_mode: host
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN must be set in /opt/portfolio/.env}
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '5'

volumes:
  caddy_data:
  caddy_config:
