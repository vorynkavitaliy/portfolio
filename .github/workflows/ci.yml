name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    services:
      mailpit:
        image: axllent/mailpit:v1.31.4@sha256:b68349e3a014b90c5610bfb26b2ae36f3892d7b8cf25ee140c6c71c98d2fcf48
        ports:
          - 127.0.0.1:1025:1025
          - 127.0.0.1:8025:8025
        env:
          MP_SMTP_AUTH_ACCEPT_ANY: '1'
          MP_SMTP_AUTH_ALLOW_INSECURE: '1'
          MP_MAX_MESSAGES: '500'
        options: >-
          --health-cmd "/mailpit readyz"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

      - name: Write private content list
        env:
          FORBIDDEN_NAMES_JSON: ${{ secrets.FORBIDDEN_NAMES_JSON }}
        run: |
          if [ -z "${FORBIDDEN_NAMES_JSON}" ]; then
            echo "::error::Secret FORBIDDEN_NAMES_JSON is not available (fork PRs do not receive secrets)."
            exit 1
          fi
          umask 077
          printf '%s' "${FORBIDDEN_NAMES_JSON}" | base64 --decode > tests/back/content/forbidden.local.json
          node -e "JSON.parse(require('node:fs').readFileSync('tests/back/content/forbidden.local.json','utf8'))"

      - name: Verify (typecheck, lint, format, build)
        run: npm run verify

      - name: Server tests
        run: npm run test:server

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: UI tests
        run: npm run test:ui

      - name: E2E tests
        run: npm run test:e2e

      - name: Bundle budget
        run: npm run budget

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: node_modules/.cache/portfolio-e2e/results
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove private content list
        if: always()
        run: rm -f tests/back/content/forbidden.local.json
